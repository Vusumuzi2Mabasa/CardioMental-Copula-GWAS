name: Numerical controls and small benchmark
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  controls:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.1'
          use-public-rspm: true
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Install R validation dependency
        run: Rscript --vanilla -e 'install.packages("jsonlite", repos="https://cloud.r-project.org")'
      - name: Oracle algebra and numerical controls
        run: python v2/src/test_oracle.py
      - name: Independent R likelihood and score validation
        run: Rscript --vanilla v2/src/crosscheck.R v2
      - name: Small independent benchmark
        run: python v2/src/run.py --smoke --workers 2
      - name: Expected information identities and local power
        run: python v2/src/information.py
      - name: Independent R integration of expected information
        run: Rscript --vanilla v2/src/information_check.R v2
      - name: Install established colocalisation validation package
        run: |
          Rscript --vanilla -e 'install.packages("remotes",repos="https://cloud.r-project.org"); remotes::install_version("susieR",version="0.14.2",repos="https://cloud.r-project.org",upgrade="never"); remotes::install_version("coloc",version="5.2.3",repos="https://cloud.r-project.org",upgrade="never")'
      - name: African LD shared effect numerical controls
        run: python v3/src/test_model.py
      - name: Independent R GWAS and established coloc cross check
        run: |
          python v3/src/export_r.py
          Rscript --vanilla v3/src/crosscheck.R v3
      - name: Small African LD pipeline
        run: python v3/src/run.py --smoke --workers 2
      - name: Established multi signal fine mapping controls
        run: Rscript --vanilla v4/src/check_finemap.R v4
      - name: Bivariate REML algebra and independent R validation
        run: |
          python v4/src/test_reml.py
          Rscript --vanilla v4/src/check_reml.R v4
      - name: Small ancestry aware fine mapping pipeline
        run: |
          python v4/src/export_finemap.py --phase cal --smoke
          Rscript --vanilla v4/src/finemap.R v4 cal smoke
      - name: Small polygenic mixed model pipeline
        run: python v4/src/polygenic.py --smoke
